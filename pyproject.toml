[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cctv-video-hud"
version = "1.0.0"
description = "Flask web app displaying a real RTSP camera stream with a sci-tech HUD overlay and Open-Meteo weather data."
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "opencv-python>=4.10",
    "numpy>=1.26.4",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "gunicorn>=22.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
